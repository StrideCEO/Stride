<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stride — Run Smarter</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: black;
    }

    .hero {
      height: 100vh;
      background: url("splash.png.jpeg") center / cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 40px;
    }

    .appstore-link {
      text-decoration: none;
      color: white;
      font-size: 1rem;
      opacity: 0.95;
      border: 1px solid rgba(255,255,255,0.45);
      padding: 14px 32px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
    }

    .appstore-link:hover {
      background: rgba(255,255,255,0.15);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="hero">
    <a
      class="appstore-link"
      href="https://apps.apple.com/"
      target="_blank"
    >
      View on the App Store
    </a>
  </div>
</body>
</html>
