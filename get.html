<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#4F46E5">
  <title>Get Stride</title>
  <link rel="icon" href="stride-logo.png">
  <!-- Without JavaScript, go straight to the App Store. -->
  <noscript><meta http-equiv="refresh" content="0;url=https://apps.apple.com/app/apple-store/id6746232026?pt=127850192&amp;ct=coaches_appstore_nov26&amp;mt=8"></noscript>
  <style>
    :root { --bg: #ffffff; --ink: #111827; --muted: #667085; --brand: #4f46e5; --line: #e5e7eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f0e1a; --ink: #f3f4f6; --muted: #a3a3b8; --brand: #8b85ff; --line: #2a2840; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--ink);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 24px max(16px, env(safe-area-inset-left, 0px));
    }
    main { width: 100%; max-width: 380px; text-align: center; display: flex; flex-direction: column; gap: 14px; }
    section { display: flex; flex-direction: column; gap: 14px; }
    .mark { font-weight: 800; letter-spacing: 0.04em; font-size: 22px; }
    h1 { font-size: 20px; line-height: 1.3; margin: 0; }
    p { margin: 0; color: var(--muted); }
    .btn {
      display: block; padding: 14px 18px; border-radius: 10px; font-weight: 700; text-decoration: none;
      background: var(--brand); color: #fff;
    }
    .btn.secondary { background: transparent; color: var(--brand); border: 1px solid var(--line); }
    .btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
    [hidden] { display: none !important; }
  </style>
  <!-- Same tracking as every page: records the visit with its utm tags. -->
  <script src="analytics.js?v=2"></script>
</head>
<body>
  <main>
    <div class="mark">STRIDE</div>

    <!-- iPhone / iPad: shown while the App Store opens. -->
    <section id="ios">
      <h1>Opening the App Store…</h1>
      <p>Stride: Run Smarter. Free for your whole team.</p>
      <a class="btn" id="open-store" href="https://apps.apple.com/app/apple-store/id6746232026?pt=127850192&amp;ct=coaches_appstore_nov26&amp;mt=8">Open in the App Store</a>
    </section>

    <!-- Android and computers: no redirect. -->
    <section id="other" hidden>
      <h1>Stride is iPhone-only right now</h1>
      <p id="other-note">Open this link on your iPhone to download it.</p>
      <a class="btn" id="desktop-store" hidden href="https://apps.apple.com/app/apple-store/id6746232026?pt=127850192&amp;ct=coaches_appstore_nov26&amp;mt=8">Get it on the App Store</a>
      <a class="btn secondary" id="coach-link" href="for-coaches.html">See Stride for coaches</a>
    </section>
  </main>

  <script>
    (function () {
      var STORE_URL = 'https://apps.apple.com/app/apple-store/id6746232026?pt=127850192&ct=coaches_appstore_nov26&mt=8';
      var started = Date.now();

      var params = new URLSearchParams(window.location.search);
      var props = {
        utm_source: params.get('utm_source'),
        utm_medium: params.get('utm_medium'),
        utm_campaign: params.get('utm_campaign'),
        utm_content: params.get('utm_content'),
        app_store_ct: 'coaches_appstore_nov26',
      };

      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPod|iPad/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      props.platform = isIOS ? 'ios' : isAndroid ? 'android' : 'desktop';

      // analytics.js rewrites App Store links to the ad's campaign name; this page
      // always sends App Store installs to coaches_appstore_nov26.
      function keepStoreLinks() {
        document.getElementById('open-store').href = STORE_URL;
        document.getElementById('desktop-store').href = STORE_URL;
        // The coach page keeps the same tags, so the visit still counts for the ad.
        document.getElementById('coach-link').href = 'for-coaches.html' + window.location.search;
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', keepStoreLinks);
      else keepStoreLinks();

      // Call fn once the real PostHog client has loaded, or give up after maxWait.
      function whenPosthog(maxWait, fn) {
        (function check() {
          var ph = window.posthog;
          if (ph && ph.__loaded) return fn(ph);
          if (Date.now() - started >= maxWait) return fn(null);
          setTimeout(check, 50);
        })();
      }

      if (!isIOS) {
        document.getElementById('ios').hidden = true;
        document.getElementById('other').hidden = false;
        if (!isAndroid) {
          document.getElementById('desktop-store').hidden = false;
          document.getElementById('other-note').textContent = 'Get it on your iPhone from the App Store.';
        }
        whenPosthog(5000, function (ph) {
          if (ph) ph.capture('appstore_redirect_skipped', props);
        });
        return;
      }

      var gone = false;
      function go() {
        if (gone) return;
        gone = true;
        window.location.replace(STORE_URL);
      }
      // Never wait more than about a second.
      setTimeout(go, 1000);

      whenPosthog(650, function (ph) {
        if (!ph) return go();
        // sendBeacon survives the page leaving, so the event isn't lost to the redirect.
        ph.capture('appstore_redirect', props, { send_instantly: true, transport: 'sendBeacon' });
        // A moment for the beacon (and the pageview, sent on page hide) to go out.
        setTimeout(go, 300);
      });
    })();
  </script>
</body>
</html>
